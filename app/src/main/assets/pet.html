<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #pet {
      width: 120px;
      height: 120px;
      cursor: pointer;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <svg id="pet" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <!-- 阴影 -->
    <ellipse cx="16" cy="28" rx="10" ry="2" fill="#000000" opacity="0.2"/>
    
    <!-- 棕色身体 -->
    <rect x="8" y="12" width="16" height="14" fill="#C17A5C"/>
    <rect x="6" y="14" width="2" height="10" fill="#C17A5C"/>
    <rect x="24" y="14" width="2" height="10" fill="#C17A5C"/>
    <rect x="10" y="10" width="12" height="2" fill="#C17A5C"/>
    
    <!-- 腿 -->
    <rect x="8" y="26" width="3" height="3" fill="#8B5A3C"/>
    <rect x="21" y="26" width="3" height="3" fill="#8B5A3C"/>
    <rect x="11" y="26" width="2" height="2" fill="#8B5A3C"/>
    <rect x="19" y="26" width="2" height="2" fill="#8B5A3C"/>
    
    <!-- 眼睛 -->
    <rect id="eyeL" x="11" y="16" width="3" height="3" fill="#000000"/>
    <rect id="eyeR" x="18" y="16" width="3" height="3" fill="#000000"/>
    
    <!-- 鼻子 -->
    <rect x="15" y="20" width="2" height="1" fill="#8B5A3C"/>
    
    <!-- 小黄鸟 -->
    <g id="bird">
      <rect x="20" y="6" width="8" height="6" fill="#F4D03F" rx="1"/>
      <rect x="28" y="8" width="3" height="2" fill="#F39C12"/>
      <rect x="22" y="8" width="1" height="1" fill="#000000"/>
      <rect x="25" y="8" width="1" height="1" fill="#000000"/>
      <rect x="26" y="6" width="2" height="2" fill="#F7DC6F"/>
    </g>
  </svg>

  <script>
    const eyeL = document.getElementById('eyeL');
    const eyeR = document.getElementById('eyeR');
    const bird = document.getElementById('bird');
    
    // 眨眼
    function blink() {
      eyeL.setAttribute('height', '1');
      eyeR.setAttribute('height', '1');
      setTimeout(() => {
        eyeL.setAttribute('height', '3');
        eyeR.setAttribute('height', '3');
      }, 150);
      setTimeout(blink, 2000 + Math.random() * 3000);
    }
    setTimeout(blink, 1000);
    
    // 小鸟偶尔跳
    function birdJump() {
      bird.setAttribute('transform', 'translate(0, -2)');
      setTimeout(() => bird.setAttribute('transform', 'translate(0, 0)'), 200);
      setTimeout(birdJump, 3000 + Math.random() * 4000);
    }
    setTimeout(birdJump, 2000);
    
    // 被戳反馈
    document.getElementById('pet').addEventListener('click', () => {
      document.body.style.transform = 'scale(0.95)';
      setTimeout(() => document.body.style.transform = 'scale(1)', 100);
    });
    
    // 双击害羞
    let lastClick = 0;
    document.getElementById('pet').addEventListener('click', () => {
      const now = Date.now();
      if (now - lastClick < 300) {
        // 害羞，眼睛变成弯线
        eyeL.setAttribute('width', '1');
        eyeR.setAttribute('width', '1');
        setTimeout(() => {
          eyeL.setAttribute('width', '3');
          eyeR.setAttribute('width', '3');
        }, 500);
      }
      lastClick = now;
    });
  </script>
</body>
</html>
