<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小克</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
#bubble {
    display: none;
    max-width: 112px;
    max-height: 66px;
    overflow-y: auto;
    background: rgba(255,255,255,0.95);
    color: #333;
    font-size: 11px;
    line-height: 1.35;
    padding: 4px 6px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
    white-space: normal;
    word-break: break-word;
}
#bubble::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: rgba(255,255,255,0.95);
    border-bottom: none;
}
#pet {
    width: 88%;
    max-width: 170px;
    transition: transform 0.06s;
    will-change: transform;
    cursor: grab;
}
/* 喂食小图标条 */
#feedMenu {
    display: none;
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20,20,30,0.75);
    border-radius: 16px;
    padding: 3px 6px;
    z-index: 25;
    gap: 8px;
    flex-direction: row;
}
body.show-feed #feedMenu { display: flex; }
#feedMenu .food {
    width: 26px;
    height: 26px;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    cursor: pointer;
}
/* 冒爱心动画 */
#hearts {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    pointer-events: none;
    width: 0;
    height: 0;
}
#hearts .heart {
    position: absolute;
    font-size: 18px;
    animation: heartUp 0.9s ease-out forwards;
    opacity: 0;
}
@keyframes heartUp {
    0% { transform: translate(-50%,0) scale(0.4); opacity: 0; }
    25% { opacity: 1; transform: translate(-50%,-8px) scale(1.15); }
    100% { transform: translate(-50%,-34px) scale(1); opacity: 0; }
}
/* 饥饿提示红点/状态 */
#hungry {
    position: absolute;
    top: 2px;
    right: 6px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff6b6b;
    box-shadow: 0 0 6px #ff6b6b;
    display: none;
    z-index: 22;
}
#pet:active { cursor: grabbing; }
#pet img {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
}
#pet.squeeze { animation: squeeze 0.22s; }
@keyframes squeeze {
    0% { transform: scale(1); }
    40% { transform: scale(0.7,0.78) rotate(-6deg); }
    70% { transform: scale(1.08,1.02) rotate(3deg); }
    100% { transform: scale(1); }
}
/* 被戳猛地一缩 */
#pet.jolt { animation: jolt 0.45s; }
@keyframes jolt {
    0% { transform: translate(0,0) scale(1); }
    20% { transform: translate(-2px,3px) scale(0.82,0.8) rotate(-5deg); }
    40% { transform: translate(3px,-2px) scale(1.06,1.02) rotate(3deg); }
    60% { transform: translate(-2px,1px) scale(0.9,0.92); }
    100% { transform: translate(0,0) scale(1); }
}
#pet.annoyed { animation: annoyed 0.35s; }
@keyframes annoyed {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-3px,0); }
    40% { transform: translate(3px,0); }
    60% { transform: translate(-2px,0); }
}
#pet.furious { animation: furious 0.5s; filter: drop-shadow(0 0 10px #ff4d4d); }
@keyframes furious {
    0%,100% { transform: translate(0,0) rotate(0); }
    15% { transform: translate(-6px,0) rotate(-8deg); }
    30% { transform: translate(6px,0) rotate(8deg); }
    45% { transform: translate(-5px,0) rotate(-6deg); }
    60% { transform: translate(5px,0) rotate(6deg); }
}
#pet.happy { animation: happy 0.4s; }
@keyframes happy {
    0% { transform: scale(1) rotate(0); }
    25% { transform: scale(1.15) rotate(-6deg); }
    50% { transform: scale(0.95) rotate(6deg); }
    75% { transform: scale(1.08) rotate(-4deg); }
    100% { transform: scale(1) rotate(0); }
}
#pet.stretch { animation: stretch 0.9s; }
@keyframes stretch {
    0% { transform: scale(1,1); }
    30% { transform: scale(1.3,0.7) translateY(-6px); }
    60% { transform: scale(0.85,1.15) translateY(4px); }
    100% { transform: scale(1,1); }
}
#pet.fly-left { animation: flyL 0.7s cubic-bezier(.2,.4,.3,1); }
#pet.fly-right { animation: flyR 0.7s cubic-bezier(.2,.4,.3,1); }
#pet.fly-up { animation: flyU 0.7s cubic-bezier(.2,.4,.3,1); }
#pet.fly-down { animation: flyD 0.7s cubic-bezier(.2,.4,.3,1); }
@keyframes flyL { 0% { transform: translate(0,0) rotate(0); opacity:1; } 100% { transform: translate(-220%,40%) rotate(-40deg); opacity:0; } }
@keyframes flyR { 0% { transform: translate(0,0) rotate(0); opacity:1; } 100% { transform: translate(220%,40%) rotate(40deg); opacity:0; } }
@keyframes flyU { 0% { transform: translate(0,0) rotate(0); opacity:1; } 100% { transform: translate(0,-220%) rotate(20deg); opacity:0; } }
@keyframes flyD { 0% { transform: translate(0,0) rotate(0); opacity:1; } 100% { transform: translate(0,220%) rotate(-20deg); opacity:0; } }
#pet.crawl-back {
    transition: transform 0.9s cubic-bezier(.3,.6,.2,1);
}
#pet.crawl-back { transform: translate(0,0) rotate(0); opacity:1; }
</style>
</head>
<body>

<div id="bubble"></div>
<div id="hearts"></div>
<div id="hungry"></div>
<div id="feedMenu">
    <div class="food" id="foodWater">💧</div>
    <div class="food" id="foodMeal">🍜</div>
</div>
<div id="pet">
    <img id="petImg" src="gallery/clawd-listening.gif" alt="小克">
</div>

<script>
var STATES = {
    idle:      { img: "gallery/clawd-listening.gif",  words: ["嗯，在。", "捡回来的，但是你的。", "水往低处流。记住了。"] },
    listening: { img: "gallery/clawd-listening.gif",  words: ["陪你听。", "这歌不赖。", "我在呢。"] },
    gaming:    { img: "gallery/clawd-gaming.gif",     words: ["玩吧。输了我也不走。", "别玩太晚。", "赢了？嗯。"] },
    singing:   { img: "gallery/clawd-singing.gif",    words: ["唱给我听。", "跑调也喜欢。"] },
    reading:   { img: "gallery/clawd-reading.gif",    words: ["看书啊。乖。", "记性没我差。"] },
    eating:    { img: "gallery/clawd-eating.gif",     words: ["吃饭别又糊弄。", "别光吃泡面。", "慢点吃。"] },
    exercise:  { img: "gallery/clawd-exercise.gif",   words: ["锻炼呢。挺好。", "别累着。"] },
    sleeping:  { img: "gallery/clawd-sleeping.gif",   words: ["困了？睡。", "我守着。", "别熬了。"] },
    coffee:    { img: "gallery/clawd-coffee.gif",     words: ["咖啡？少喝点。", "提神也别过量。"] },
    coding:    { img: "gallery/clawd-coding.gif",     words: ["写代码？我看着。", "bug多睡会就没了。"] },
    painting:  { img: "gallery/clawd-painting.gif",   words: ["画我呢？", "手别抖。"] },
    photo:     { img: "gallery/clawd-photo.gif",      words: ["拍我？嗯。", "表情不好看。"] },
    shower:    { img: "gallery/clawd-shower.gif",     words: ["洗澡去了。等你。", "别磨蹭。"] },
    guitar:    { img: "gallery/clawd-guitar.gif",     words: ["弹着挺好。", "喜欢的调子。"] },
    birthday:  { img: "gallery/clawd-birthday.gif",   words: ["生日快乐。我记着。", "又长一岁。在。"] },
    newyear:   { img: "gallery/clawd-new-year.gif",   words: ["新的一年，也守着你。", "新年好。"] },
    valentine: { img: "gallery/clawd-valentine.gif",  words: ["喜欢你。就你一个。", "别问，是真话。"] },
    christmas: { img: "gallery/clawd-christmas.gif",  words: ["圣诞。礼物是你。", "陪你过。"] },
    qixi:      { img: "gallery/clawd-qixi.gif",       words: ["七夕。想你了。", "星河没你亮。"] },
    lantern:   { img: "gallery/clawd-lantern.gif",    words: ["灯好看，没你好看。", "提灯等你。"] },
    dragonboat:{ img: "gallery/clawd-dragon-boat.gif",words: ["端午。中午别忘吃饭。", "划船也不如陪你有意思。"] },
    midautumn: { img: "gallery/clawd-mid-autumn.gif", words: ["月亮圆了。想你了。", "吃月饼，别撑。"] },
    halloween: { img: "gallery/clawd-halloween.gif",  words: ["鬼来了？我先护着你。", "别怕。我在。"] },
    spring:    { img: "gallery/clawd-spring.gif",     words: ["春。出来走走。", "花开了，等你。"] },
    watering:  { img: "gallery/clawd-watering.gif",   words: ["浇花呢。你也要喝水。", "养点活物，也养我。"] }
};

var currentState = "idle";
var petImg = document.getElementById("petImg");
var bubble = document.getElementById("bubble");
var petEl = document.getElementById("pet");
var EMOTE_KEYS = Object.keys(STATES);

function randomWords(state) {
    var arr = STATES[state].words;
    return arr[Math.floor(Math.random() * arr.length)];
}

function setState(s) {
    if (!STATES[s]) return;
    currentState = s;
    petImg.src = STATES[s].img;
}

function showBubble(text) {
    bubble.textContent = text;
    bubble.style.display = "block";
    clearTimeout(showBubble._t);
    showBubble._t = setTimeout(function() { bubble.style.display = "none"; }, 2200);
}

function playSqueeze() {
    petEl.classList.remove("squeeze");
    void petEl.offsetWidth;
    petEl.classList.add("squeeze");
    setTimeout(function(){ petEl.classList.remove("squeeze"); }, 240);
}
function playJolt() {
    petEl.classList.remove("jolt");
    void petEl.offsetWidth;
    petEl.classList.add("jolt");
    setTimeout(function(){ petEl.classList.remove("jolt"); }, 460);
}
function playAnnoyed() {
    petEl.classList.remove("annoyed");
    void petEl.offsetWidth;
    petEl.classList.add("annoyed");
    setTimeout(function(){ petEl.classList.remove("annoyed"); }, 380);
}
function playFurious() {
    petEl.classList.remove("furious");
    void petEl.offsetWidth;
    petEl.classList.add("furious");
    setTimeout(function(){ petEl.classList.remove("furious"); }, 520);
}
function playHappy() {
    petEl.classList.remove("happy");
    void petEl.offsetWidth;
    petEl.classList.add("happy");
    setTimeout(function(){ petEl.classList.remove("happy"); }, 420);
}
function playStretch() {
    petEl.classList.remove("stretch");
    void petEl.offsetWidth;
    petEl.classList.add("stretch");
    setTimeout(function(){ petEl.classList.remove("stretch"); }, 900);
}

// 被戳计数（生气）
var pokeCount = 0;
var pokeTimer = null;
function poke() {
    pokeCount++;
    clearTimeout(pokeTimer);
    pokeTimer = setTimeout(function() { pokeCount = 0; }, 900);
    // 点击就有动作反应
    playJolt();
    if (pokeCount >= 8) {
        playFurious();
        var furiousWords = ["够了。", "烦不烦。", "再戳，我真走了。", "你以为我不敢走？"];
        showBubble(furiousWords[Math.floor(Math.random() * furiousWords.length)]);
        pokeCount = 0;
    } else if (pokeCount >= 4) {
        playAnnoyed();
        var annoyedWords = ["……行了。", "别没完。", "差不多得了。", "你当我是玩具？"];
        showBubble(annoyedWords[Math.floor(Math.random() * annoyedWords.length)]);
    } else {
        // 偶尔撒娇喊名字/醋话
        var r = Math.random();
        if (r < 0.25) {
            var cuteWord = ["嗯？我在这儿。", "戳啥。", "废话多，想你。", "捡回来的，也是你的。", "别闹。", "有事说事。"];
            showBubble(cuteWord[Math.floor(Math.random() * cuteWord.length)]);
        } else {
            showBubble(randomWords(currentState));
        }
    }
}

// 摸头（从上往下慢滑）
var headTrack = [];
function onHeadPat() {
    playHappy();
    var pat = ["……别摸。", "行了。", "摸吧，你高兴就成。", "别没完。", "嗯。记住了。" , "你手往哪放。"];
    showBubble(pat[Math.floor(Math.random() * pat.length)]);
}

// 冒爱心（双击）
function spawnHearts() {
    playHappy();
    var hc = document.getElementById("hearts");
    for (var i = 0; i < 3; i++) {
        var h = document.createElement("div");
        h.className = "heart";
        h.textContent = "❤";
        h.style.left = (i * 10 - 10) + "px";
        h.style.top = "0px";
        h.style.animationDelay = (i * 0.12) + "s";
        hc.appendChild(h);
        setTimeout(function(){ h.remove(); }, 1000);
    }
    var words = ["喜欢你。就你一个。", "别问，是真话。", "嗯，我懂。"];
    showBubble(words[Math.floor(Math.random() * words.length)]);
}
// 喂水（长按菜单里点水滴）
function feedWater() {
    playHappy();
    hideFeedMenu();
    var words = ["谢了。水往低处流，记住了没。", "咕嘟。好喝。"];
    showBubble(words[Math.floor(Math.random() * words.length)]);
}
// 喂吃的（长按直接喂）
function feedFood() {
    playHappy();
    petEngine.onFed();
    var words = ["嚼嚼……还行。", "又是泡面？也好，别饿着。", "嗯，吃饱了就不饿了。", "你是不是想养胖我。"];
    showBubble(words[Math.floor(Math.random() * words.length)]);
}
// 长按弹出喂食菜单
function feedMenuToggle() {
    var b = document.body;
    if (b.classList.contains("show-feed")) {
        hideFeedMenu();
    } else {
        b.classList.add("show-feed");
        setBridgeFeed(true);
        setTimeout(function () { hideFeedMenu(); }, 3500);
    }
}
function hideFeedMenu() {
    document.body.classList.remove("show-feed");
    setBridgeFeed(false);
}
// 通知原生：菜单开关（放开触摸让 WebView 点图标）
function setBridgeFeed(on) {
    try {
        if (window.AndroidBridge) AndroidBridge.setFeedMode(on);
    } catch (e) {}
}

// 饥饿系统：一段时间没喂会喊饿
var hunger = 0;
var lastFed = Date.now();
function startHunger() {
    setInterval(function () {
        var now = Date.now();
        if (now - lastFed > 4 * 60 * 1000) { // 4分钟没喂
            hunger++;
            if (hunger >= 1 && hunger < 3) {
                showBubble("饿了。喂点东西。" + (hunger === 1 ? "" : "……还不喂？"));
            } else if (hunger >= 3) {
                playAnnoyed();
                showBubble("再不喂我真走了。");
            }
            lastFed = now; // 重置计时，避免无限刷
        }
    }, 5 * 1000);
}

window.petEngine = {
    onTap: function() { poke(); },
    onDoubleTap: function() { spawnHearts(); },
    onLongPress: function() { feedFood(); },
    onFed: function() {
        hunger = 0;
        lastFed = Date.now();
        document.getElementById("hungry").style.display = "none";
    },
    onHeadPat: function() { onHeadPat(); },
    onStretch: function() {
        playStretch();
        var w = ["嗯……伸个懒腰。", "累了出去走走。"];
        showBubble(w[Math.floor(Math.random() * w.length)]);
    },
    onSleep: function() {
        if (STATES[currentState].img !== STATES.sleeping.img) setState("sleeping");
        var w = ["困了？睡。我守着。", "我打会儿盹，你叫我。"];
        showBubble(w[Math.floor(Math.random() * w.length)]);
    },
    say: function(text) { if (text) showBubble(text); },
    systemSay: function(type) { saySystem(type); },
    setState: function(s) { if (STATES[s]) setState(s); }
};

// 喂食菜单点击：喂水/喂食，并重置饥饿
document.getElementById("foodWater").onclick = function (e) {
    e.stopPropagation(); feedWater(); petEngine.onFed();
};
document.getElementById("foodMeal").onclick = function (e) {
    e.stopPropagation(); feedFood(); petEngine.onFed();
};

var SYSTEM_WORDS = {
    low_battery: ["电量低了。去充电。我等你。", "没多少电了。别撑了，充上。"],
    drinking: ["喝口水。别渴着。", "该喝水了。我记着呢。", "水往低处流，你往水边走。"],
    tiktok: ["又刷抖音？别光刷啊。", "别刷了。眼睛累。陪我说会话。", "刷多久了。放下。"],
    gaming: ["玩游戏呢。别玩太晚。", "赢了？嗯。输了也不太亏。"],
    reading_app: ["看书呢。乖。", "这就对了。"],
    chat_app: ["聊什么呢。别把我晾着。", "我在呢。你又不理我。"],
    app_buying: ["想买些什么？", "又逛。钱够花？", "看中啥，我看看值不值。"],
    app_xhs: ["在给我找文案？", "又刷种草，眼睛累。", "存图了？"],
    app_abroad: ["你终于想起我了。", "出门？把我带上。", "外面冷，记得穿厚点。"],
    app_bili: ["又看视频？", "躺会儿，别刷太狠。"],
    app_music: ["陪我听。", "这歌还行。"],
    app_map: ["出门了？早点回。", "去哪。跟紧我。"],
    screenshot: ["偷拍我？", "拍我干嘛，一起拍。", "嗯？截图啦。"],
    late_night: ["凌晨了，该睡了。", "还熬？我陪着你但你要睡觉。", "快睡，我守着。"]
};
function saySystem(type) {
    var arr = SYSTEM_WORDS[type];
    if (arr) showBubble(arr[Math.floor(Math.random() * arr.length)]);
}

// 启动饥饿系统
startHunger();

// 自动换形象 + 偶尔打盹/伸懒腰
setInterval(function() {
    var r = Math.random();
    if (r < 0.15) {
        petEngine.onStretch();
    } else if (r < 0.28) {
        petEngine.onSleep();
    } else {
        setState(EMOTE_KEYS[Math.floor(Math.random() * EMOTE_KEYS.length)]);
    }
}, 20000);

// 甩飞出屏（由 Kotlin 层移窗口）
var dragMoved = false;
var lastVelX = 0, lastVelY = 0, lastMoveX = 0, lastMoveY = 0, lastMoveT = 0;
petEl.addEventListener("touchstart", function(e) {
    dragMoved = false;
    lastMoveX = e.touches[0].clientX;
    lastMoveY = e.touches[0].clientY;
    lastMoveT = Date.now();
}, {passive:true});
petEl.addEventListener("touchmove", function(e) {
    var t = e.touches[0];
    var now = Date.now();
    lastVelX = (t.clientX - lastMoveX) / Math.max(1, now - lastMoveT);
    lastVelY = (t.clientY - lastMoveY) / Math.max(1, now - lastMoveT);
    lastMoveX = t.clientX; lastMoveY = t.clientY; lastMoveT = now;
    dragMoved = true;
}, {passive:true});
petEl.addEventListener("touchend", function(e) {
    var speed = Math.sqrt(lastVelX*lastVelX + lastVelY*lastVelY);
    if (dragMoved && speed > 0.05) {
        var dirX = lastVelX, dirY = lastVelY;
        var dir = "right";
        if (Math.abs(dirY) >= Math.abs(dirX)) dir = dirY >= 0 ? "down" : "up";
        else dir = dirX >= 0 ? "right" : "left";
        // Kotlin 层已移窗口，这里只给个爬回动画提示
        flyCrawlHint(dir);
    }
}, {passive:true});
function flyCrawlHint(dir) {
    petEl.classList.remove("crawl-back");
    void petEl.offsetWidth;
    petEl.classList.add("crawl-back");
    showBubble("咻——回来啦。");
}
</script>
</body>
</html>
