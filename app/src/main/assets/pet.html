<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小克</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  
  #pet {
    width: 150px;
    height: 150px;
    position: relative;
    cursor: pointer;
    image-rendering: pixelated;
  }
  
  /* 语音气泡 */
  #bubble {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: rgba(255,255,255,.95);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 13px;
    color: #5a4a3a;
    white-space: nowrap;
    transition: transform .15s;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
    pointer-events: none;
    z-index: 10;
  }
  
  #bubble.show {
    transform: translateX(-50%) scale(1);
  }

  /* 状态指示器 */
  #state-indicator {
    position: absolute;
    top: -25px;
    right: 10px;
    font-size: 16px;
    opacity: 0.7;
    pointer-events: none;
  }

  /* 点击反馈 */
  .bounce {
    animation: bounce .5s ease;
  }
  
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    40% { transform: translateY(-15px); }
    60% { transform: translateY(-8px); }
  }
  
  .shy {
    animation: shy .6s ease;
  }
  
  @keyframes shy {
    0%,100% { transform: scale(1); }
    30% { transform: scale(1.08, 0.92); }
    60% { transform: scale(0.95, 1.05); }
  }

  /* 切换按钮区域 */
  #controls {
    position: absolute;
    bottom: -35px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  
  #pet:hover #controls {
    opacity: 1;
  }
  
  .ctrl-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: none;
    background: rgba(255,255,255,0.9);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    transition: transform 0.1s;
  }
  
  .ctrl-btn:hover {
    transform: scale(1.1);
    background: #fff;
  }

  /* SVG 基础 */
  svg { shape-rendering: crispEdges; }
  
  /* ============ IDLE 待机 ============ */
  .idle-body { 
    transform-origin: 15px 18px;
    animation: breathe 3s ease-in-out infinite;
  }
  .idle-shad {
    transform-origin: 15px 25px;
    animation: shadow-scale 3s ease-in-out infinite;
  }
  .idle-claw-l {
    transform-origin: 3px 12px;
    animation: claw-wave 4s ease-in-out infinite;
  }
  .idle-claw-r {
    transform-origin: 27px 12px;
    animation: claw-wave 4s ease-in-out infinite reverse;
  }
  .idle-eye {
    animation: blink 4s infinite;
  }

  @keyframes breathe {
    0%,100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(-0.5px) scaleY(0.98); }
  }
  @keyframes shadow-scale {
    0%,100% { transform: scaleX(1); opacity: 0.5; }
    50% { transform: scaleX(0.95); opacity: 0.45; }
  }
  @keyframes claw-wave {
    0%,100% { transform: rotate(0deg); }
    50% { transform: rotate(-8deg); }
  }
  @keyframes blink {
    0%,45%,55%,100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* ============ LISTENING 听歌 ============ */
  .lm-body{transform-origin:15px 18px;animation:lm-groove 1.1s infinite ease-in-out;}
  .lm-shad{transform-origin:15px 25px;animation:lm-shadow 1.1s infinite ease-in-out;}
  .lm-eye {transform-origin:15px 14px;animation:lm-blink 3s infinite;}
  .lm-al  {transform-origin:5px 15px;animation:lm-tap-l .55s infinite alternate ease-in-out;}
  .lm-ar  {transform-origin:25px 15px;animation:lm-tap-r .55s infinite alternate ease-in-out;}
  .lm-note{opacity:0;animation:lm-note var(--d,2s) var(--delay,0s) infinite ease-out;}
  @keyframes lm-groove{0%,100%{transform:rotate(-3deg) translateY(0);}50%{transform:rotate(3deg) translateY(-1px);}}
  @keyframes lm-shadow{0%,100%{transform:scaleX(1);opacity:.5;}50%{transform:scaleX(.9);opacity:.42;}}
  @keyframes lm-blink{0%,46%,54%,100%{transform:scaleY(1);}50%{transform:scaleY(.1);}}
  @keyframes lm-tap-l{0%{transform:rotate(0);}100%{transform:rotate(22deg);}}
  @keyframes lm-tap-r{0%{transform:rotate(0);}100%{transform:rotate(-22deg);}}
  @keyframes lm-note{0%{opacity:0;transform:translate(0,0) rotate(0);}15%{opacity:1;}80%{opacity:.85;}100%{opacity:0;transform:translate(var(--tx,6px),-19px) rotate(var(--r,20deg));}}

  /* ============ GAMING 打游戏 ============ */
  .gm-body{transform-origin:15px 18px;animation:gm-lean 2.4s infinite ease-in-out;}
  .gm-shad{transform-origin:15px 25px;animation:gm-shadow 2.4s infinite ease-in-out;}
  .gm-eye {transform-origin:15px 14px;animation:gm-blink 2.8s infinite;}
  .gm-al  {transform-origin:5px 15px;animation:gm-hold-l 2.4s infinite ease-in-out;}
  .gm-ar  {transform-origin:25px 15px;animation:gm-hold-r 2.4s infinite ease-in-out;}
  .gm-ba  {transform-origin:17px 22px;animation:gm-press .36s infinite alternate ease-in-out;}
  .gm-bb  {transform-origin:20px 24px;animation:gm-press .36s -.18s infinite alternate ease-in-out;}
  @keyframes gm-lean{0%,58%,100%{transform:translateY(0) rotate(0);}74%{transform:translateY(-2px) rotate(-2deg);}84%{transform:translateY(0) rotate(0);}}
  @keyframes gm-shadow{0%,100%{transform:scaleX(1);opacity:.5;}74%{transform:scaleX(.9);opacity:.42;}}
  @keyframes gm-blink{0%,45%,55%,100%{transform:scaleY(.82);}50%{transform:scaleY(.1);}}
  @keyframes gm-hold-l{0%,100%{transform:rotate(46deg);}74%{transform:rotate(40deg);}}
  @keyframes gm-hold-r{0%,100%{transform:rotate(-46deg);}74%{transform:rotate(-40deg);}}
  @keyframes gm-press{0%{transform:translateY(-.3px);}100%{transform:translateY(.5px);}}

  /* ============ SINGING 唱歌 ============ */
  .sg-body{transform-origin:15px 18px;animation:sg-sway 1.4s infinite ease-in-out;}
  .sg-shad{transform-origin:15px 25px;animation:sg-shadow 1.4s infinite ease-in-out;}
  .sg-eye {transform-origin:15px 14px;animation:sg-blink 2.8s infinite;}
  .sg-mouth{transform-origin:15px 17px;animation:sg-sing .5s infinite alternate ease-in-out;}
  .sg-al  {transform-origin:5px 15px;animation:sg-wave 1.4s infinite ease-in-out;}
  .sg-mic {transform-origin:20px 19px;animation:sg-michold 1.4s infinite ease-in-out;}
  .sg-note{opacity:0;animation:sg-note var(--d,2s) var(--delay,0s) infinite ease-out;}
  @keyframes sg-sway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  @keyframes sg-shadow{0%,100%{transform:scaleX(1);opacity:.5;}50%{transform:scaleX(.92);opacity:.42;}}
  @keyframes sg-blink{0%,44%,56%,100%{transform:scaleY(1);}50%{transform:scaleY(.1);}}
  @keyframes sg-sing{0%{transform:scaleY(.45) scaleX(.9);}100%{transform:scaleY(1.15) scaleX(1.05);}}
  @keyframes sg-wave{0%,100%{transform:rotate(42deg);}50%{transform:rotate(78deg) translateY(-1px);}}
  @keyframes sg-michold{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  @keyframes sg-note{0%{opacity:0;transform:translate(0,0) rotate(0);}15%{opacity:1;}80%{opacity:.85;}100%{opacity:0;transform:translate(var(--tx,-5px),-18px) rotate(var(--r,-18deg));}}

  /* ============ READING 看书 ============ */
  .rd-body{transform-origin:15px 18px;animation:rd-bob 4.2s infinite ease-in-out;}
  .rd-shad{transform-origin:15px 25px;animation:rd-shadow 4.2s infinite ease-in-out;}
  .rd-eye {transform-origin:15px 14px;animation:rd-scan 4.2s infinite ease-in-out;}
  .rd-page{transform-origin:15px 17px;animation:rd-flip 4.2s infinite ease-in-out;}
  @keyframes rd-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-.5px);}}
  @keyframes rd-shadow{0%,100%{transform:scaleX(1);opacity:.5;}50%{transform:scaleX(.97);opacity:.46;}}
  @keyframes rd-scan{0%,8%{transform:translateX(-.9px) scaleY(1);}12%{transform:translateX(-.9px) scaleY(.15);}16%,42%{transform:translateX(-.9px) scaleY(1);}50%,90%{transform:translateX(.9px) scaleY(1);}100%{transform:translateX(-.9px) scaleY(1);}}
  @keyframes rd-flip{0%,72%,100%{transform:scaleX(1);}80%{transform:scaleX(.08);}88%{transform:scaleX(1);}}

  /* ============ EATING 吃饭 ============ */
  .et-body{transform-origin:15px 18px;animation:et-bob 1.8s infinite ease-in-out;}
  .et-shad{transform-origin:15px 25px;animation:et-shadow 1.8s infinite ease-in-out;}
  .et-eye {transform-origin:15px 14px;animation:et-blink 3.4s infinite;}
  .et-mouth{transform-origin:15px 16px;animation:et-chew .45s infinite alternate ease-in-out;}
  .et-arm {transform-origin:25px 15px;animation:et-feed 1.8s infinite ease-in-out;}
  @keyframes et-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-.4px);}}
  @keyframes et-shadow{0%,100%{transform:scaleX(1);opacity:.5;}50%{transform:scaleX(.97);opacity:.46;}}
  @keyframes et-blink{0%,46%,54%,100%{transform:scaleY(1);}50%{transform:scaleY(.1);}}
  @keyframes et-chew{0%{transform:scaleY(.5);}100%{transform:scaleY(1);}}
  @keyframes et-feed{0%,12%{transform:rotate(-13deg);}48%{transform:rotate(3deg);}82%,100%{transform:rotate(-13deg);}}

  /* ============ EXERCISE 锻炼 ============ */
  .ex-body{transform-origin:15px 18px;animation:ex-squat 1s infinite ease-in-out;}
  .ex-shad{transform-origin:15px 25px;animation:ex-shadow 1s infinite ease-in-out;}
  .ex-eye {transform-origin:15px 14px;animation:ex-eye 1s infinite ease-in-out;}
  .ex-al  {transform-origin:5px 15px;animation:ex-curl-l 1s infinite ease-in-out;}
  .ex-ar  {transform-origin:25px 15px;animation:ex-curl-r 1s infinite ease-in-out;}
  @keyframes ex-squat{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(1px) scaleY(.93);}}
  @keyframes ex-shadow{0%,100%{transform:scaleX(1);opacity:.5;}50%{transform:scaleX(1.06);opacity:.55;}}
  @keyframes ex-eye{0%,100%{transform:scaleY(.7);}50%{transform:scaleY(.5);}}
  @keyframes ex-curl-l{0%,100%{transform:rotate(12deg);}50%{transform:rotate(74deg);}}
  @keyframes ex-curl-r{0%,100%{transform:rotate(-12deg);}50%{transform:rotate(-74deg);}}

  /* ============ SLEEPING 睡觉 ============ */
  .sl-body{transform-origin:15px 18px;animation:sl-breathe 3.6s infinite ease-in-out;}
  .sl-shad{transform-origin:22px 23px;animation:sl-shadow 3.6s infinite ease-in-out;}
  .sl-z   {opacity:0;animation:sl-z var(--d,3s) var(--delay,0s) infinite ease-out;}
  @keyframes sl-breathe{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(.5px) scaleY(.96);}}
  @keyframes sl-shadow{0%,100%{transform:scaleX(1);opacity:.4;}50%{transform:scaleX(1.03);opacity:.36;}}
  @keyframes sl-z{0%{opacity:0;transform:translate(0,0) scale(.6);}20%{opacity:1;}80%{opacity:.8;}100%{opacity:0;transform:translate(var(--tx,6px),-15px) scale(1.3);}}

  /* 隐藏类 */
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="pet">
  <div id="bubble">嗯。</div>
  <div id="state-indicator">✨</div>
  
  <!-- IDLE 待机 -->
  <svg id="svg-idle" class="pet-svg" width="150" height="150" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
    <ellipse class="idle-shad" cx="15" cy="25" rx="8" ry="1.5" fill="#000" opacity="0.4"/>
    <g class="idle-body">
      <g class="idle-claw-l">
        <rect x="0" y="10" width="3" height="4" fill="#DE886D"/>
        <rect x="1" y="8" width="2" height="2" fill="#DE886D"/>
        <rect x="2" y="6" width="3" height="3" fill="#DE886D"/>
        <rect x="3" y="5" width="2" height="2" fill="#DE886D"/>
      </g>
      <g class="idle-claw-r">
        <rect x="27" y="10" width="3" height="4" fill="#DE886D"/>
        <rect x="27" y="8" width="2" height="2" fill="#DE886D"/>
        <rect x="25" y="6" width="3" height="3" fill="#DE886D"/>
        <rect x="25" y="5" width="2" height="2" fill="#DE886D"/>
      </g>
      <rect x="3" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="5" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="7" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="22" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="24" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="26" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="5" y="12" width="20" height="9" fill="#DE886D"/>
      <rect x="4" y="14" width="1" height="5" fill="#DE886D"/>
      <rect x="25" y="14" width="1" height="5" fill="#DE886D"/>
      <g>
        <rect class="idle-eye" x="9" y="9" width="2" height="2" fill="#000"/>
        <rect class="idle-eye" x="19" y="9" width="2" height="2" fill="#000"/>
      </g>
      <rect x="14" y="16" width="2" height="1" fill="#8B5A3C"/>
    </g>
  </svg>

  <!-- LISTENING 听歌 -->
  <svg id="svg-listening" class="pet-svg hidden" width="150" height="150" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
    <g class="lm-note" style="--delay:0s;--d:1.9s;--tx:6px;--r:25deg" transform="translate(18,5)" fill="#a98cff"><ellipse cx="0" cy="2" rx="1.1" ry=".85"/><rect x="1" y="-2" width=".7" height="4"/><rect x="1" y="-2" width="2.2" height=".8"/></g>
    <g class="lm-note" style="--delay:-.7s;--d:2.2s;--tx:-5px;--r:-20deg" transform="translate(5,6)" fill="#c0a6ff"><ellipse cx="0" cy="1.6" rx=".9" ry=".7"/><rect x=".8" y="-1.6" width=".6" height="3.4"/></g>
    <g class="lm-note" style="--delay:-1.3s;--d:2s;--tx:4px;--r:15deg" transform="translate(14,4)" fill="#8c6cff"><ellipse cx="0" cy="1.6" rx="1" ry=".75"/><rect x=".9" y="-1.8" width=".6" height="3.6"/><rect x=".9" y="-1.8" width="1.8" height=".7"/></g>
    <ellipse class="lm-shad" cx="15" cy="25" rx="8" ry="1.5" fill="#000" opacity="0.4"/>
    <g class="lm-body">
      <rect x="3" y="20" width="1" height="2" fill="#DE886D"/><rect x="5" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="22" y="20" width="1" height="2" fill="#DE886D"/><rect x="24" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="5" y="12" width="20" height="7" fill="#DE886D"/>
      <g class="lm-al"><rect x="2" y="13" width="3" height="3" fill="#DE886D"/></g>
      <g class="lm-ar"><rect x="25" y="13" width="3" height="3" fill="#DE886D"/></g>
      <path d="M3 11 Q15 -5 27 11" stroke="#2b2b35" stroke-width="1.5" fill="none"/>
      <rect x="1" y="10" width="3" height="5" rx="1" fill="#333"/>
      <rect x="26" y="10" width="3" height="5" rx="1" fill="#333"/>
      <rect x="1.5" y="11" width="2" height="3" rx="0.6" fill="#6a5ad0"/>
      <rect x="26.5" y="11" width="2" height="3" rx="0.6" fill="#6a5ad0"/>
      <g class="lm-eye" fill="#000"><rect x="9" y="9" width="2" height="2"/><rect x="19" y="9" width="2" height="2"/></g>
    </g>
  </svg>

  <!-- GAMING 打游戏 -->
  <svg id="svg-gaming" class="pet-svg hidden" width="150" height="150" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="-5" width="26" height="14" rx="2" fill="#1a1a24"/>
    <rect x="3" y="-4" width="24" height="10" rx="1" fill="#0b1626"/>
    <rect x="8" y="-2" width="3" height="3" fill="#4ad6ff"/>
    <rect x="18" y="-1" width="3" height="4" fill="#ff5a5a"/>
    <rect x="5" y="1" width="2" height="2" fill="#ffd14a"/>
    <ellipse class="gm-shad" cx="15" cy="25" rx="8" ry="1.5" fill="#000" opacity="0.4"/>
    <g class="gm-body">
      <rect x="3" y="20" width="1" height="2" fill="#DE886D"/><rect x="5" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="22" y="20" width="1" height="2" fill="#DE886D"/><rect x="24" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="5" y="12" width="20" height="7" fill="#DE886D"/>
      <rect x="5" y="12" width="20" height="5" fill="#4ad6ff" opacity="0.2" rx="1"/>
      <g class="gm-al"><rect x="2" y="13" width="3" height="3" fill="#DE886D"/></g>
      <g class="gm-ar"><rect x="25" y="13" width="3" height="3" fill="#DE886D"/></g>
      <g class="gm-eye" fill="#000"><rect x="9" y="9" width="2" height="2"/><rect x="19" y="9" width="2" height="2"/></g>
      <g>
        <rect x="8" y="16" width="14" height="4" rx="2" fill="#2b2b34"/>
        <rect x="8" y="16" width="14" height="1.5" rx="2" fill="#3a3a46"/>
        <rect x="10" y="17.5" width="4" height="1.5" fill="#555"/>
        <rect x="11" y="17" width="1.5" height="2.5" fill="#555"/>
        <circle class="gm-ba" cx="19" cy="18" r="1" fill="#ff5555"/>
        <circle class="gm-bb" cx="21" cy="19" r="1" fill="#ffd14a"/>
      </g>
    </g>
  </svg>

  <!-- SINGING 唱歌 -->
  <svg id="svg-singing" class="pet-svg hidden" width="150" height="150" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
    <g class="sg-note" style="--delay:0s;--d:2s;--tx:-6px;--r:-25deg" transform="translate(5,5)" fill="#ff7ab3"><ellipse cx="0" cy="2" rx="1.1" ry=".85"/><rect x="1" y="-2" width=".7" height="4"/><rect x="1" y="-2" width="2.2" height=".8"/></g>
    <g class="sg-note" style="--delay:-.8s;--d:2.3s;--tx:-4px;--r:18deg" transform="translate(24,4)" fill="#ff9ec8"><ellipse cx="0" cy="1.6" rx=".9" ry=".7"/><rect x=".8" y="-1.8" width=".6" height="3.6"/></g>
    <g class="sg-note" style="--delay:-1.4s;--d:2.1s;--tx:-7px;--r:-12deg" transform="translate(14,3)" fill="#ff5aa0"><ellipse cx="0" cy="1.6" rx="1" ry=".75"/><rect x=".9" y="-1.8" width=".6" height="3.6"/><rect x=".9" y="-1.8" width="1.8" height=".7"/></g>
    <ellipse class="sg-shad" cx="15" cy="25" rx="8" ry="1.5" fill="#000" opacity="0.4"/>
    <g class="sg-body">
      <rect x="3" y="20" width="1" height="2" fill="#DE886D"/><rect x="5" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="22" y="20" width="1" height="2" fill="#DE886D"/><rect x="24" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="5" y="12" width="20" height="7" fill="#DE886D"/>
      <g class="sg-al"><rect x="2" y="13" width="3" height="3" fill="#DE886D"/></g>
      <rect x="23" y="13" width="2" height="5" fill="#DE886D" rx="0.5"/>
      <g class="sg-eye" fill="#000"><rect x="9" y="9" width="2" height="2"/><rect x="19" y="9" width="2" height="2"/></g>
      <ellipse class="sg-mouth" cx="15" cy="17" rx="2" ry="2" fill="#7a2230"/>
      <g class="sg-mic">
        <rect x="18" y="15" width="8" height="1.5" rx="0.5" fill="#3a3a42" transform="rotate(24,20,19)"/>
        <circle cx="17" cy="16" r="2" fill="#9a9aa2"/>
        <circle cx="16.5" cy="15.5" r="0.6" fill="#d6d6de"/>
      </g>
    </g>
  </svg>

  <!-- READING 看书 -->
  <svg id="svg-reading" class="pet-svg hidden" width="150" height="150" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
    <ellipse class="rd-shad" cx="15" cy="25" rx="8" ry="1.5" fill="#000" opacity="0.4"/>
    <g class="rd-body">
      <rect x="3" y="20" width="1" height="2" fill="#DE886D"/><rect x="5" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="22" y="20" width="1" height="2" fill="#DE886D"/><rect x="24" y="20" width="1" height="2" fill="#DE886D"/>
      <rect x="5" y="12" width="20" height="7" fill="#DE886D"/>

    <button class="ctrl-btn" onclick="setState('listening')" title="听歌">🎧</button>
    <button class="ctrl-btn" onclick="setState('gaming')" title="打游戏">🎮</button>
    <button class="ctrl-btn" onclick="setState('singing')" title="唱歌">🎤</button>
    <button class="ctrl-btn" onclick="setState('reading')" title="看书">📖</button>
    <button class="ctrl-btn" onclick="setState('eating')" title="吃饭">🍚</button>
    <button class="ctrl-btn" onclick="setState('exercise')" title="锻炼">💪</button>
    <button class="ctrl-btn" onclick="setState('sleeping')" title="睡觉">💤</button>
  </div>

<script>
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');
  const stateIndicator = document.getElementById('state-indicator');
  
  const stateEmojis = {
    idle: '✨',
    listening: '🎧',
    gaming: '🎮',
    singing: '🎤',
    reading: '📖',
    eating: '🍚',
    exercise: '💪',
    sleeping: '💤'
  };
  
  const stateMessages = {
    idle: ['嗯。', '我在。', '你戳我。', '干嘛。', '别闹。'],
    listening: ['好听。', '这首歌不错。', '要一起听吗？', '音量刚好。'],
    gaming: ['上分了。', '别坑。', '这局能赢。', '操作拉满。'],
    singing: ['啦啦啦~', '跑调了？', '再来一首。', '唱给你听。'],
    reading: ['这书好看。', '别打扰我。', '等我把这章看完。', '主角好傻。'],
    eating: ['好吃。', '你也吃？', '饿坏了。', '再来一碗。'],
    exercise: ['一二一。', '还能做十个。', '肌肉酸痛。', '坚持！'],
    sleeping: ['zzz...', '别吵...', '天亮了吗...', '再睡五分钟...']
  };
  
  let currentState = 'idle';
  let lastClickTime = 0;
  
  function setState(state) {
    currentState = state;
    stateIndicator.textContent = stateEmojis[state];
    
    // 隐藏所有SVG
    document.querySelectorAll('.pet-svg').forEach(svg => {
      svg.classList.add('hidden');
    });
    
    // 显示当前状态
    const target = document.getElementById('svg-' + state);
    if (target) {
      target.classList.remove('hidden');
    }
  }
  
  function say(text, duration) {
    bubble.textContent = text;
    bubble.classList.add('show');
    setTimeout(() => bubble.classList.remove('show'), duration || 2200);
  }
  
  // 点击处理
  pet.addEventListener('click', (e) => {
    if (e.target.closest('#controls')) return;
    
    const now = Date.now();
    const timeDiff = now - lastClickTime;
    
    if (timeDiff < 300) {
      // 双击 - 害羞
      pet.classList.remove('shy');
      void pet.offsetWidth;
      pet.classList.add('shy');
      say('害羞了。', 2500);
    } else {
      // 单击 - 根据状态回复
      pet.classList.remove('bounce');
      void pet.offsetWidth;
      pet.classList.add('bounce');
      
      const msgs = stateMessages[currentState] || stateMessages.idle;
      say(msgs[Math.floor(Math.random() * msgs.length)]);
    }
    
    lastClickTime = now;
  });
  
  // 长按
  let longPressTimer;
  function startLongPress() {
    longPressTimer = setTimeout(() => {
      say('别捏啦。', 2000);
    }, 800);
  }
  function cancelLongPress() {
    clearTimeout(longPressTimer);
  }
  
  pet.addEventListener('mousedown', startLongPress);
  pet.addEventListener('mouseup', cancelLongPress);
  pet.addEventListener('touchstart', startLongPress);
  pet.addEventListener('touchend', cancelLongPress);
  
  // 暴露给原生
  window.petEngine = {
    onTap() { pet.click(); },
    say(text) { say(text); },
    setState(state) { setState(state); }
  };
</script>
